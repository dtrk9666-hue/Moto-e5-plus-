name: "Build Moto E5 Plus eBPF Kernel"

on:
  push:
    branches:
      - main
      - "lineage-20"
    paths:
      - "patches/**"
      - "configs/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      localversion:
        description: "Kernel LOCALVERSION suffix"
        required: false
        default: "-HannahForge-eBPF"

permissions:
  contents: write

env:
  DEVICE_CODENAME: "hannah"
  KERNEL_ARCH: "arm64"
  KERNEL_DEFCONFIG: "hannah_defconfig"
  SOURCE_REPO: "LineageOS/android_kernel_motorola_msm8953"
  SOURCE_BRANCH: "lineage-20"
  CROSS_COMPILE: "aarch64-linux-gnu-"
  LOCALVERSION: "-HannahForge-eBPF"

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout patch & workflow repository
        uses: actions/checkout@v4

      - name: Install Android kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git kmod libssl-dev \
            libelf-dev python3 unzip zip zstd

      - name: Clone Moto E5 Plus kernel source
        run: |
          git clone --depth=1 --branch "${{ env.SOURCE_BRANCH }}" \
            "https://github.com/${{ env.SOURCE_REPO }}.git" kernel-src

      - name: Setup AOSP Clang r498229b
        run: |
          mkdir -p "$HOME/toolchains/aosp-clang"
          curl -sSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r498229b.tar.gz" | tar -xz -C "$HOME/toolchains/aosp-clang"
          echo "$HOME/toolchains/aosp-clang/bin" >> "$GITHUB_PATH"

      - name: Restore ccache for hannah
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hannah-arm64-4.9-${{ github.sha }}
          restore-keys: |
            ccache-hannah-arm64-4.9-

      - name: Validate eBPF & custom driver patches
        run: |
          chmod +x scripts/apply_patches.sh
          ./scripts/apply_patches.sh --dry-run kernel-src

      - name: Apply eBPF & custom driver patches
        run: |
          chmod +x scripts/apply_patches.sh
          ./scripts/apply_patches.sh kernel-src

      - name: Merge custom defconfig fragment
        run: |
          cat "configs/hannah_ebpf_custom.fragment" >> "kernel-src/arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_DEFCONFIG }}"

      - name: Compile Moto E5 Plus (hannah) kernel
        run: |
          cd kernel-src
          export ARCH="${{ env.KERNEL_ARCH }}"
          export SUBARCH="${{ env.KERNEL_ARCH }}"
          export CC="ccache clang"
          ccache -M 4G
          make O=out "${{ env.KERNEL_DEFCONFIG }}"
          make -j"$(nproc --all)" O=out \
            ARCH="${{ env.KERNEL_ARCH }}" \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            Image.gz-dtb

      - name: Package flashable AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel-build
          cp anykernel/anykernel.sh anykernel-build/anykernel.sh
          cp kernel-src/out/arch/arm64/boot/Image.gz-dtb anykernel-build/
          cd anykernel-build
          zip -r9 "../MotoE5Plus-hannah-eBPF-${{ github.run_number }}.zip" . -x ".git*" "README.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-e5-plus-hannah-kernel
          path: MotoE5Plus-hannah-eBPF-${{ github.run_number }}.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "hannah-ebpf-r${{ github.run_number }}"
          name: "Moto E5 Plus (hannah) eBPF Kernel r${{ github.run_number }}"
          body: |
            Automated kernel build for **Moto E5 Plus (Global / US Retail)** (`Qualcomm MSM8937 (Snapdragon 435)`).
            - Kernel base: Linux 4.9 (`arm64`)
            - Toolchain: AOSP Clang r498229b
            - eBPF patches: 5 active
            - Custom drivers: 10 active (Charge cap 90%, Undervolt mild, ZRAM 1536MB lz4)
          files: MotoE5Plus-hannah-eBPF-${{ github.run_number }}.zip
